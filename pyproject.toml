[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roboarena"
version = "0.2.0"
description = "基于 MuJoCo 的机器人硬件仿真接口"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.4,<4",
    "numpy",
]

[project.scripts]
roboarena = "roboarena.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
legacy = ["h5py", "matplotlib", "pandas"]
planning = [
    "ompl>=1.6,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["roboarena*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
