[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robohal"
version = "0.2.0"
description = "基于 MuJoCo 的机器人硬件仿真接口"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.4,<4",
    "numpy",
]

[project.scripts]
robohal = "robohal.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["robohal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
