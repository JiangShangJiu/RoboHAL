[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roboarena"
version = "0.1.0"
description = "机器人学习数据采集与可视化"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=2.3.3",
    "numpy",
    "h5py",
    "matplotlib",
    "pandas",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
